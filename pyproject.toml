[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ownership-and-boards"
version = "0.1.0"
description = "How ownership constellations translate into board seats: Chile (CMF) and Spain (CNMV)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ignacio Mendoza Rojas" }]
dependencies = [
    "pandas>=2.1",
    "requests>=2.31",
    "lxml>=5",
    "beautifulsoup4>=4.12",
    "html5lib>=1.1",
    "pdfplumber>=0.11",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
boards-probe = "boards.probe:main"
boards = "boards.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/boards"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
