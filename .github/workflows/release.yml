name: Release

# Publishes a GitHub release whenever VERSION changes on main (and creates its tag). Zenodo
# archives every release of this repository and gives it a DOI; the metadata come from
# .zenodo.json and CITATION.cff.
on:
  push:
    branches: [main]
    paths: ["VERSION"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="v$(tr -d '[:space:]' < VERSION)"
          if gh release view "$v" >/dev/null 2>&1; then
            echo "::notice title=release::$v already exists"
            exit 0
          fi
          gh release create "$v" --target "$GITHUB_SHA" --title "$v" --generate-notes
          echo "::notice title=release::published $v"
