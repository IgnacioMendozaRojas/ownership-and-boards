name: Pilot data

# Downloads the pilot sample: 30 Chilean firms (CMF company pages, 2010 to the last full year) and
# 12 Spanish firms (CNMV governance reports, 2015 to the last full year, ownership, board and pay
# sections). Runs resume where the last one stopped; each job commits its progress even if it
# stops early, and a report that fails to download is logged and retried. These pages are the
# public websites, not the CMF API.
on:
  # every 15 April: December shareholders and the annual governance reports are out by then
  schedule:
    - cron: "17 6 15 4 *"
  push:
    paths:
      - "config/pilot.yaml"
      - ".github/workflows/pilot.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        country: [cl, es]
    concurrency:
      group: pilot-${{ matrix.country }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir .
      - name: Download
        run: timeout 110m boards fetch-${{ matrix.country }} --budget 2500
      - name: Commit progress
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data
          git add -A data
          git diff --cached --quiet && exit 0
          git commit -qm "Pilot data: ${{ matrix.country }}"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1

  report:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    concurrency:
      group: pilot-report
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install --no-cache-dir .
      - name: Rebuild panels, figures and the latest reading
        run: |
          git pull -q origin main
          boards report
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/processed docs/figures latest.json README.md
          git diff --cached --quiet && exit 0
          git commit -qm "Report: panels, figures and latest reading"
          for i in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((i * 10))
          done
          exit 1
